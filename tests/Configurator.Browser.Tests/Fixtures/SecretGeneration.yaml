$schema: urn:islamu:configurator:authoring:v0.0.1
identity:
  familyId: "518339a1-5305-4d52-8474-f1dcc644e5cc"
  revision: 2
project:
  id: example.browser-secret-qualification
  name: Synthetic browser secret qualification
applicationVersions: ["1.0"]
localization:
  defaultLocale: en
  translations:
    ar:
      direction: rtl
      overrides: {}
configuration:
  type: object
  additionalProperties: false
  required: [password, token, aes, identity, argon, bcrypt, pbkdf256, pbkdf512, digest, rsa, ec]
  x-configurator:
    sensitivity: public
  properties:
    password:
      type: string
      title: Local password
      minLength: 24
      maxLength: 64
      x-configurator:
        secret:
          kind: password
          acquisition: local
          constraints: {allowWhitespace: false, minDigits: 1, minSymbols: 1}
          generation: {length: 32}
    token:
      type: string
      title: Opaque token
      x-configurator:
        secret: {kind: opaque-token, acquisition: local, encoding: base64url, generation: {bytes: 32}}
    aes:
      type: string
      title: AES256 key
      x-configurator:
        secret: {kind: symmetric-key, acquisition: local, algorithm: AES256, encoding: hex, generation: {bytes: 32}}
    identity:
      type: string
      title: Identity V3 password hash
      x-configurator:
        secret:
          kind: password-hash
          acquisition: local
          algorithm: aspnet-identity-v3
          generation:
            input: generated
            password: {kind: password, acquisition: local, generation: {length: 32}}
    argon:
      type: string
      title: Argon2id password hash
      x-configurator:
        secret: {kind: password-hash, acquisition: local, algorithm: argon2id, generation: {input: entered}}
    bcrypt:
      type: string
      title: Bcrypt password hash
      x-configurator:
        secret: {kind: password-hash, acquisition: local, algorithm: bcrypt, generation: {input: entered}}
    pbkdf256:
      type: string
      title: PBKDF2 SHA256 password hash
      x-configurator:
        secret: {kind: password-hash, acquisition: local, algorithm: pbkdf2-sha256, generation: {input: entered}}
    pbkdf512:
      type: string
      title: PBKDF2 SHA512 password hash
      x-configurator:
        secret: {kind: password-hash, acquisition: local, algorithm: pbkdf2-sha512, generation: {input: entered}}
    digest:
      type: string
      title: SHA256 digest
      x-configurator:
        secret: {kind: digest, acquisition: local, algorithm: SHA256, encoding: hex, generation: {input: entered}}
    rsa:
      type: string
      title: RSA PKCS8 private key
      x-configurator:
        secret: {kind: private-key, acquisition: local, algorithm: RS256, encoding: pkcs8-pem, constraints: {keySize: 2048}, generation: {}}
    ec:
      type: string
      title: EC P256 private JWK
      x-configurator:
        secret: {kind: private-key, acquisition: local, algorithm: ES256, encoding: jwk, generation: {}}
outputs:
  config.json:
    id: config
    format: json
