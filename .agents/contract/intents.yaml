version: 1
intents:
  - id: repository-tooling
    title: "Maintain repository foundation and native engineering tools"
    category: infrastructure
    triggers: ["repository foundation","build configuration","engineering tools"]
    must_read_docs: [AGENTS.md, docs/internal/extraction/FOUNDATION.md]
    load_skills: ["conventional-commit","ip-clean-room"]
    load_rules: [.agents/rules/tests.md, .agents/rules/ip-clean-room.md]
    paths_in_scope: ["eng/agent-workflow/**","eng/release/**","eng/configurator/probes/**","Directory.*.props","global.json","NuGet.Config"]
    minimum_tests: ["Configurator.AgentWorkflow.Tests","Configurator.ReleaseEngineering.Tests"]
    docs_to_update: [docs/internal/extraction/FOUNDATION.md]
    unique_acceptance: ["No Event assembly, runtime service or trust authority dependency"]
    pr_checklist: ["Record exact affected-owner verification commands and outcomes"]
    forbidden_without_approval: ["Publishing releases or replacing trusted signer authority"]
    criticality:
      tier: standard
      required_model_tier: economical
      verification_depth: standard
      tenancy_scope: system_level
      rollback_strategy: atomic_revert
      intake_clarification_mode: autonomous_defaults
      exploration_protocol: bounded_caller_callee
      testing_strategy: behavioral_unit_integration
      review_protocol: peer_review
      safety_gates: ["no_private_to_public_projection", "no_warning_suppression"]
