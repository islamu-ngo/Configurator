    title: "Maintain repository foundation and native engineering tools"
    category: infrastructure
    triggers: ["repository foundation","build configuration","engineering tools"]
    must_read_docs: [AGENTS.md, PROJECTS.md, docs/internal/OPERATIONS.md]
    load_skills: []
    load_rules: [.agents/rules/tests.md, .agents/rules/ip-clean-room.md]
