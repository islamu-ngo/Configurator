    minimum_tests: []
    docs_to_update: [docs/internal/OPERATIONS.md]
    unique_acceptance: ["No Event assembly, runtime service or trust authority dependency"]
    pr_checklist: ["Select affected engineering checks from PROJECTS.md; AgentWorkflow and ReleaseEngineering suites apply only to their owners", "For documentation validator or knowledge-tool changes, run the native self-tests and exercised commands in eng/knowledge/README.md"]
    forbidden_without_approval: ["Publishing releases or replacing trusted signer authority"]
    criticality:
      tier: standard
      required_model_tier: economical
      verification_depth: standard
      tenancy_scope: system_level
      rollback_strategy: atomic_revert
      intake_clarification_mode: autonomous_defaults
      exploration_protocol: bounded_caller_callee
      testing_strategy: behavioral_unit_integration
      review_protocol: peer_review
      safety_gates: ["no_private_to_public_projection", "no_warning_suppression"]
