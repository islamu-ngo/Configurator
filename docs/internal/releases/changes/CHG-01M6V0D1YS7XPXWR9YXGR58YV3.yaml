    Reference: docs/internal/adr/ADR-native-directory-acquisition.md
    Disposition: documented
    Detail: "Use Artifacts CompositionDirectoryCompiler instead of Core directory sources and barriers; Core accepts ordered in-memory JSON and YAML sources."
  Security:
    Reference: docs/internal/PROTECTED_ARTIFACTS.md
    Disposition: mitigated
    Detail: "Native reads and rechecks stay in Artifacts; Core has no native filesystem authority."
  Migration:
    Reference: docs/internal/adr/ADR-native-directory-acquisition.md
    Disposition: documented
    Detail: "Migrate native composition callers and custom barriers to Configurator.Artifacts.Composition; directory traversal limits are separate from Core semantic limits."
