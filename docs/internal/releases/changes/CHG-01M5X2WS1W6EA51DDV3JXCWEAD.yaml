Title: "require browser custody preparation before editing"
Type: fix
Scope: privacy
Summary: "Require the real browser custody policy before enabling answer entry. Missing wiring cannot silently succeed; incomplete public preparation and rejected custody acknowledgment deny import and queued preparation as well as rendered controls."
