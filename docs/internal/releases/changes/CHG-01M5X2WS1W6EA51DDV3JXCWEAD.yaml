    Reference: docs/internal/LAUNCH_CONTRACT.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/LAUNCH_CONTRACT.md
    Disposition: documented
    Detail: "Readiness requires successful public preparation and the current custody acknowledgment. Starting again invalidates older output/import eligibility; denied handlers do not read answer files or compose output."
  Migration:
    Reference: docs/internal/LAUNCH_CONTRACT.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/internal/LAUNCH_CONTRACT.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/internal/LAUNCH_CONTRACT.md
    Disposition: not-applicable
  Operator:
    Reference: docs/public/browser.md
    Disposition: documented
    Detail: "Answer entry, import and preparation remain unavailable when public app preparation or custody acknowledgment is incomplete or rejected. Selecting a definition does not grant readiness."
