Title: "Constrain secret generation options to admitted policy"
Type: feat
Scope: privacy
Summary: "Allow callers to tighten generation length, byte count and character choices while enforcing schema requirements and the free-draw entropy floor, with injected unbiased index sampling and cleared working buffers."
Group: secret-generation-options
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/CORE_DEFINITION_CONTRACT.md
    Disposition: not-applicable
  Security:
    Reference: src/Configurator.Core/Secrets/SecretGenerationBounds.cs
    Disposition: documented
    Detail: "Options can tighten admitted schema requirements but cannot disable required character classes or lower the 128-bit free-draw entropy floor. Injected randomness uses rejection sampling for index selection; temporary working buffers are cleared without claiming complete managed-string erasure."
