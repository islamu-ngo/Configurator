Title: "Add generic unsigned delivery receipt verification tool"
Type: feat
Scope: definitions
Summary: "Add eng/configurator/DefinitionDelivery.cs to verify canonical agreement between a public definition source and compiled runtime JSON, validate declared selectors and credential-free public HTTPS source URLs, and write or read-only check deterministic unsigned release.json receipts carrying explicit non-authority markers without altering prior receipts on rejection."
Group: delivery-verification
Supersedes: []
