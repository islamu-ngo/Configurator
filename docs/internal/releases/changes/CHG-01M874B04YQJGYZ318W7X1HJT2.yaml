    Reference: docs/internal/MAINTAINER_AUTHORING.md
    Disposition: not-applicable
  Security:
    Reference: docs/internal/PACKAGING.md
    Disposition: documented
    Detail: "Enforces byte-exact source/runtime canonical agreement, rejects symlinks, oversized inputs, undeclared selectors, non-HTTPS/credentialed/loopback/RFC1918/link-local URLs, preserves prior receipts on rejection, and explicitly marks trustBoundary as unsigned-local-verification-only."
  Migration:
    Reference: docs/internal/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/public/integrate-your-tool.md
    Disposition: documented
    Detail: "Adds eng/configurator/DefinitionDelivery.cs (--write / --check / --self-test) for deterministic unsigned release.json delivery verification."
  OpenAPI:
