Title: "settle operation faults and clear private roots coherently"
Type: fix
Scope: privacy
Summary: "Failed operations release busy state and clear private output without invalidating newer work. Private clearing removes protected roots in one revision, fences pending imports, and preserves public roots. Notifications follow coherent state transitions outside ownership gates."
Group: terminal-hardening
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/PRESENTATION_STATE.md
    Disposition: documented
    Detail: "Workspace-owned operation, result and public-input properties are now read-only. Callers must use SetPublicInput and workspace lifecycle methods instead of assigning generated property setters."
  Security:
    Reference: docs/internal/PRESENTATION_STATE.md
    Disposition: documented
    Detail: "Atomic matching settlement rejects old faults; batch clearing and import revision fences prevent private-state resurrection. Cancellation source retirement waits for workers and callbacks."
  Migration:
    Reference: docs/internal/PRESENTATION_STATE.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/internal/PRESENTATION_STATE.md
    Disposition: not-applicable
  OpenAPI:
    Reference: docs/internal/PRESENTATION_STATE.md
    Disposition: not-applicable
  Operator:
