Change-Id: CHG-01M4G97J4EKCFBXYFN2AGFQJHD
Title: "clear replaced and discarded prepared output"
Type: fix
Scope: privacy
Summary: "Give presentation outcomes their own output buffer and clear it when replaced, invalidated, terminated, disposed or discarded after cancellation. Dispose composed artifacts and clear temporary copies while retaining a settled result when cancellation explicitly preserves it."
Group: custody
Supersedes: []
