Title: "Inspect public definition workflows through bounded CLI pages"
Type: feat
Scope: self-hosting
Summary: "Expose definition output options, conditional next actions and suggested-value links as a bounded, digest-bound structural inventory without reading answers or writing files."
Group: cli-definition-workflow-inspection
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/internal/CLI_CONTRACT.md
    Disposition: not-applicable
