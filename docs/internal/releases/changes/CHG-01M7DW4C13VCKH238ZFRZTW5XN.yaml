    Disposition: not-applicable
  Configuration:
    Reference: docs/public/cli.md
    Disposition: documented
    Detail: "Definition inspect uses bounded offset/limit pages with a definition-bound continuation digest and explicit size, offset and mismatch failures."
  OpenAPI:
    Reference: schemas/configurator-cli.schema.json
    Disposition: not-applicable
  Operator:
    Reference: docs/public/cli.md
    Disposition: documented
