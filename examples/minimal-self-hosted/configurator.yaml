$schema: urn:islamu:configurator:authoring:v0.0.1
# Fresh v2 family allocated through the native identity editor.
identity:
  familyId: "4d8950ad-972c-4357-8605-7a7c89c05a17"
  revision: 1
project:
  id: example.service
  name: Minimal self-hosted service
  publisher: example
applicationVersions: ["1.0"]
localization:
  defaultLocale: en
  translations:
    # No Arabic text was supplied by the prior source; retain base-text fallback.
    ar:
      direction: rtl
      overrides: {}
presentation:
  defaultJourney: recommended
  navigation: wizard
  sections:
    - id: service
      title: Service identity and deployment
      description: Name the deployment and choose how much of it to configure.
      pointers: [/service.name, /service.mode]
    - id: access
      title: Local service access
      description: The password the service uses locally; it is never generated or installed for you.
      pointers: [/service.credential]
    - id: operations
      title: Extended operations
      description: Optional metrics and worker settings, offered in extended mode.
      pointers: [/service.extended, /metrics.enabled]
    - id: integration
      title: Optional issuer integration
      description: Connect an external token issuer only when adapting the example.
      pointers: [/service.issuerToken]
  journeys:
    - id: recommended
      title: Recommended
      sections: [service, access, operations, integration]
    - id: custom
      title: Custom
      sections: [service, operations, access, integration]
configuration:
  type: object
  additionalProperties: false
  required: [service.name, service.credential]
  x-configurator:
    sensitivity: public
  # Dots are literal property-name characters, not nesting operators.
  properties:
    service.name:
      type: string
      title: Service name
      description: Choose a recognizable name for this deployment.
      minLength: 1
      maxLength: 128
      x-configurator:
        sensitivity: public
        detail: basic
        initialValue: local-service
        placeholder: local-service
        guidance:
          instructions: Use a deployment label, not a password or a private customer identifier.
          searchTerms: [name, identity, deployment]
    service.mode:
      type: string
      title: Deployment mode
      description: >-
        Selecting extended activates metrics and nested operations settings; it
        does not start services or expose a network port.
      x-configurator:
        sensitivity: public
        detail: basic
        initialValue: minimal
        widget: radio
        choices:
          - value: minimal
            explanation: Keeps the base configuration.
          - value: extended
            explanation: Makes optional operations settings available.
        guidance:
          instructions: Keep minimal unless you intend to review extended operations. Both modes still require the local service password.
          searchTerms: [mode, minimal, extended, deployment]
    metrics.enabled:
      type: boolean
      title: Enable metrics
      description: Expose metrics only on a network controlled by the operator.
      x-configurator:
        sensitivity: public
        detail: advanced
        widget: switch
        booleanLabels: {"true": Metrics on, "false": Metrics off}
        applicableWhen:
          op: equals
          reference: {scope: root, path: /service.mode}
          value: extended
        initialValue: false
        guidance:
          instructions: Leave disabled unless the target supports metrics and you have arranged an appropriate private network.
          searchTerms: [monitoring, observability, metrics]
    service.credential:
      type: string
      title: Local service password
      description: Create a unique password for this service, not your hosting login. Enable secret entry first, or defer it and finish the incomplete draft locally.
      minLength: 1
      maxLength: 128
      x-configurator:
        sensitivity: secret
        detail: basic
        secret:
          kind: password
          acquisition: local
        guidance:
          instructions: Create and retain the password in your own password manager. Configurator does not generate it or install it on the target.
          searchTerms: [password, credential, access]
    service.issuerToken:
      type: string
      title: Optional issuer token
      description: Leave absent unless adapting this example to a service with an external token issuer. This example includes no issuer or token endpoint.
      minLength: 1
      maxLength: 4096
      x-configurator:
        sensitivity: secret
        detail: advanced
        defaultText: Without a token the service runs without an external issuer.
        guidance:
          instructions: Obtain a scoped service token through your issuer's documented administrator workflow. Ask that administrator about permissions and expiry; do not substitute the local service password. No provider documentation link is supplied because this neutral example names no provider.
          searchTerms: [issuer, token, integration, permissions]
    service.extended:
      type: object
      title: Extended operations settings
      description: Optional nested settings for an adapted service; omit the object to retain target-owned behavior.
      additionalProperties: false
      x-configurator:
        sensitivity: public
        detail: standard
        applicableWhen:
          op: equals
          reference: {scope: root, path: /service.mode}
          value: extended
        guidance:
          instructions: These illustrative keys need an explicit mapping in a real target integration. Configurator only prepares them.
          searchTerms: [operations, workers, logging]
      properties:
        workers:
          type: integer
          title: Worker count
          description: Optional worker count; confirm the target supports it.
          minimum: 1
          maximum: 64
          x-configurator:
            sensitivity: public
            detail: standard
            units: workers
            placeholder: "2"
            defaultText: The target chooses its own worker count when omitted.
        logLevel:
          type: string
          title: Log detail
          description: Optional log level for a compatible target. Review target logs for private data before increasing detail.
          x-configurator:
            sensitivity: public
            detail: advanced
            defaultText: The target keeps its own log level when omitted.
            choices:
              - value: warning
              - value: information
              - value: debug
                explanation: May record request details; review logs before sharing them.
outputs:
  ".env":
    id: environment
    format: dotenv
    targetUpdateMode: create
    restartRequirement: process
    bindings:
      SERVICE_NAME: /service.name
      SERVICE_MODE: /service.mode
      METRICS_ENABLED: /metrics.enabled
      SERVICE_CREDENTIAL: /service.credential
      SERVICE_ISSUER_TOKEN: /service.issuerToken
  service.json:
    id: configuration
    format: json
    targetUpdateMode: create
    restartRequirement: process
    bindings:
      /name: /service.name
      /mode: /service.mode
      /metrics: /metrics.enabled
      /credential: /service.credential
      /issuerToken: /service.issuerToken
      /extended: /service.extended
  service.yaml:
    id: configuration-yaml
    format: yaml
    targetUpdateMode: create
    restartRequirement: process
    includeBindings: [service.json]
