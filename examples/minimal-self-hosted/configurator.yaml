$schema: urn:islamu:configurator:authoring:v1
identity:
  familyId: 69cdb122-41d2-4fab-9b82-7929a889c726
  revision: 3
project:
  id: example.service
  name: Minimal self-hosted service
  publisher: example
applicationVersions: ["1.0"]
locales: [en, ar]
fields:
  service.name:
    type: string
    title: Service name
    sensitivity: public
    disclosure: essential
    required: true
    default: local-service
    minLength: 1
    maxLength: 128
  service.mode:
    type: enum
    title: Deployment mode
    sensitivity: public
    choices: [minimal, extended]
    default: minimal
  metrics.enabled:
    type: boolean
    title: Enable metrics
    help: Expose metrics only on a network controlled by the operator.
    sensitivity: public
    disclosure: advanced
    activeWhen: {op: equals, field: service.mode, value: extended}
    default: false
  service.credential:
    type: string
    title: Service credential
    help: Enter a local credential after enabling secret entry, or defer it and complete the exported draft locally.
    sensitivity: secret
    disclosure: essential
    required: true
    minLength: 1
    maxLength: 128
outputs:
  ".env":
    id: environment
    format: dotenv
    applySemantics: create
    restart: process
    bindings:
      SERVICE_NAME: service.name
      SERVICE_MODE: service.mode
      METRICS_ENABLED: metrics.enabled
      SERVICE_CREDENTIAL: service.credential
  service.json:
    id: configuration
    format: json
    applySemantics: create
    restart: process
    bindings: {name: service.name, mode: service.mode, metrics: metrics.enabled, credential: service.credential}
  service.yaml:
    id: configuration-yaml
    format: yaml
    applySemantics: create
    restart: process
    bindings: {name: service.name, mode: service.mode, metrics: metrics.enabled, credential: service.credential}
