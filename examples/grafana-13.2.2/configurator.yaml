$schema: urn:islamu:configurator:authoring:v2
# Fresh v2 family allocated through the native identity editor.
identity:
  familyId: "ffc20a25-7ea5-4138-be3b-88f678cac36b"
  revision: 1
project:
  id: grafana.oss
  name: Grafana OSS 13.2.2 configuration example
  publisher: Configurator example (unverified)
  description: >-
    Independently authored environment and Graphite data-source provisioning
    example. Grafana startup, provisioning acceptance, and data-source
    connectivity have not been tested against this pinned release. Have Grafana
    validate the prepared files before use.
applicationVersions: ["13.2.2"]
entryPoints: [setup]
configuration:
  type: object
  additionalProperties: false
  required: [server.domain, source.name, source.url]
  x-configurator:
    sensitivity: public
  # Preserve the prior field names as exact keys; dots do not imply nesting.
  properties:
    server.domain:
      type: string
      title: Dashboard domain
      description: >-
        Supply the dashboard hostname. The hostname format records the previous
        validator's intention but is descriptive only in Phase 3; it does not
        assert hostname validity or perform a network check.
      format: hostname
      x-configurator:
        sensitivity: public
        detail: basic
    signup.enabled:
      type: boolean
      title: Allow sign-up
      x-configurator:
        sensitivity: public
        detail: standard
        initialValue: false
    source.name:
      type: string
      title: Data source label
      x-configurator:
        sensitivity: public
        detail: standard
    source.url:
      type: string
      title: Graphite endpoint
      description: >-
        Supply an absolute URI for the Graphite endpoint. The URI format records
        the previous absolute-uri validator's intention but is descriptive only
        in Phase 3; it does not assert URI validity or prove connectivity.
      format: uri
      x-configurator:
        sensitivity: public
        detail: standard
presentation:
  defaultJourney: setup
  navigation: wizard
  sections:
    - id: server
      title: Dashboard access
      pointers: [/server.domain, /signup.enabled]
    - id: datasource
      title: Graphite data source
      pointers: [/source.name, /source.url]
  journeys:
    - id: setup
      title: Setup
      sections: [server, datasource]
outputs:
  ".env":
    id: environment
    format: dotenv
    targetUpdateMode: create
    restartRequirement: process
    bindings:
      GF_SERVER_DOMAIN: {scope: root, path: /server.domain}
      GF_USERS_ALLOW_SIGN_UP: {scope: root, path: /signup.enabled}
  datasource.yaml:
    id: datasource
    format: yaml
    targetUpdateMode: create
    restartRequirement: process
    projection:
      op: object
      members:
        apiVersion: {op: literal, value: 1}
        datasources:
          op: list
          items:
            - op: object
              members:
                name:
                  op: copy
                  reference: {scope: root, path: /source.name}
                type: {op: literal, value: graphite}
                access: {op: literal, value: proxy}
                url:
                  op: copy
                  reference: {scope: root, path: /source.url}
