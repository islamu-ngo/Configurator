# INERT TEST DATA: adapted from ISLAMU-owned Event final discovery contract.
name: Release Adapter Final Discovery Fixture
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-adapter-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-adapter-final:
    name: release-adapter-final
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report final adapter contract
        run: |
          printf '%s\n' 'release-adapter-final: environment-approved trusted-code discovery only'
