name: Configurator build and package validation

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configurator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  cli-native:
    name: CLI native runtime and package (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: windows-2025
            rid: win-x64
    steps:
      - name: Checkout only Configurator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Initialize pinned workload manifests
        run: dotnet workload update
      - name: Test only the CLI owner on the native host
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          dotnet restore tests/Configurator.Cli.Tests/Configurator.Cli.Tests.csproj --locked-mode
          dotnet test --project tests/Configurator.Cli.Tests/Configurator.Cli.Tests.csproj --configuration Release --no-restore -- --minimum-expected-tests 1
      - name: Publish standalone CLI for this native host
        shell: bash
        run: |
          set -euo pipefail
          dotnet msbuild eng/configurator/Configurator.Release.proj -t:PublishConfigurator -p:ConfiguratorSurface=cli -p:ConfiguratorRid=${{ matrix.rid }} -verbosity:minimal
      - name: Smoke the actual package doctor and help entrypoints
        shell: bash
        run: |
          set -euo pipefail
          executable="$PWD/artifacts/configurator/cli/${{ matrix.rid }}/islamu-configurator"
          if [[ '${{ matrix.rid }}' == 'win-x64' ]]; then executable="$executable.exe"; fi
          # Check real package exits and output streams; CLI owner tests validate JSON semantics.
          for command in doctor help; do
            if [[ "$command" == doctor ]]; then arguments=(doctor --machine); else arguments=(--help --machine); fi
            expected=0
            if [[ "$command" == doctor && '${{ matrix.rid }}' != linux-* ]]; then expected=4; fi
            if "$executable" "${arguments[@]}" > "$RUNNER_TEMP/cli-$command.json" 2> "$RUNNER_TEMP/cli-$command.stderr"; then actual=0; else actual=$?; fi
            test "$actual" -eq "$expected"
            test -s "$RUNNER_TEMP/cli-$command.json"
            test ! -s "$RUNNER_TEMP/cli-$command.stderr"
          done
      - name: Retain unsigned native CLI validation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configurator-cli-${{ matrix.rid }}
          path: artifacts/configurator/cli/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 7

  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout only Configurator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned WebAssembly build tools
        run: |
          python3 --version
          dotnet workload install wasm-tools
      - name: Validate external Action pins
        run: dotnet run .ci/scripts/validate-action-pins.cs -- .github/workflows
      - name: Restore and build explicit destination owners
        shell: bash
        run: |
          set -euo pipefail
          # Explicit owners do not depend on extraction-time solution registration.
          for project in \
            src/Configurator.Browser.Host/Configurator.Browser.Host.csproj \
            tests/Configurator.Architecture.Tests/Configurator.Architecture.Tests.csproj \
            eng/agent-workflow/tests/Configurator.AgentWorkflow.Tests/Configurator.AgentWorkflow.Tests.csproj \
            eng/release/tests/Configurator.ReleaseEngineering.Tests/Configurator.ReleaseEngineering.Tests.csproj \
            eng/configurator/Configurator.DefinitionSchemaGenerator/Configurator.DefinitionSchemaGenerator.csproj \
            eng/configurator/Configurator.CommandSchemaGenerator/Configurator.CommandSchemaGenerator.csproj
          do
            dotnet restore "$project" --locked-mode
            dotnet build "$project" --no-restore --configuration Release --verbosity quiet
          done
          for project in eng/configurator/probes/*/*.csproj; do
            dotnet restore "$project" --locked-mode
            dotnet build "$project" --no-restore --configuration Release --verbosity quiet
          done
          for project in tests/Configurator.*.Tests/*.csproj; do
            dotnet restore "$project" --locked-mode
            dotnet build "$project" --no-restore --configuration Release --verbosity quiet
          done
      - name: Validate dependency rights and compiled contracts
        run: |
          dotnet run .ci/scripts/validate-dependency-license-policy.cs -- .
          dotnet run --project eng/configurator/Configurator.DefinitionSchemaGenerator --configuration Release --no-build -- --check
          dotnet run --file eng/configurator/ValidateConfiguratorSkill.cs -- .agents/skills/configurator-integrate/SKILL.md
          dotnet run --file eng/configurator/ValidateConfiguratorSkill.cs -- --portable skills/configurator-integrate/SKILL.md
          dotnet run --file eng/configurator/ValidateConfiguratorSkill.cs -- --self-test
          dotnet run --project eng/configurator/Configurator.CommandSchemaGenerator --configuration Release --no-build -- --check
          dotnet run eng/configurator/GenerateConfiguratorRatchets.cs -- --check
      - name: Audit restored dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/audit
          for project in src/Configurator.*/*.csproj tests/Configurator.*.Tests/*.csproj eng/configurator/*/*.csproj eng/configurator/probes/*/*.csproj eng/agent-workflow/src/*/*.csproj eng/release/src/*/*.csproj; do
            printf 'Auditing %s\n' "$project"
            dotnet list "$project" package --vulnerable --include-transitive --format json --no-restore > artifacts/audit/current.json
            dotnet run .ci/scripts/validate-nuget-vulnerabilities.cs -- artifacts/audit/current.json
          done
      - name: Build release owner and assemble standalone packages
        run: |
          dotnet build eng/configurator/Configurator.Release.proj --configuration Release --verbosity quiet
          for surface in cli terminal desktop; do
            dotnet msbuild eng/configurator/Configurator.Release.proj -t:PublishConfigurator -p:ConfiguratorSurface="$surface" -p:ConfiguratorRid=linux-x64 -verbosity:minimal
          done
          dotnet msbuild eng/configurator/Configurator.Release.proj -t:PublishConfiguratorBrowser -p:ConfiguratorOutputRoot="$PWD/artifacts/configurator-with-store" -p:DefinitionStoreSourceRoot="$PWD/store" -verbosity:minimal
          # Reuse the default destination across variants to expose stale store assets.
          dotnet msbuild eng/configurator/Configurator.Release.proj -t:PublishConfiguratorBrowser -p:DefinitionStoreSourceRoot="$PWD/store" -verbosity:minimal
          dotnet msbuild eng/configurator/Configurator.Release.proj -t:PublishConfiguratorBrowser -verbosity:minimal
      - name: Assert compiled boundaries and actual package closure
        run: |
          dotnet run .ci/scripts/validate-dependency-license-policy.cs -- .
          for project in tests/Configurator.*.Tests/*.csproj; do
            dotnet test --project "$project" --configuration Release -- --minimum-expected-tests 1
          done
          dotnet test --project eng/agent-workflow/tests/Configurator.AgentWorkflow.Tests/Configurator.AgentWorkflow.Tests.csproj --configuration Release -- --minimum-expected-tests 1
          dotnet test --project eng/release/tests/Configurator.ReleaseEngineering.Tests/Configurator.ReleaseEngineering.Tests.csproj --configuration Release -- --minimum-expected-tests 1
      - name: Write package checksums
        run: |
          dotnet run .ci/scripts/write-artifact-checksums.cs -- artifacts/configurator artifacts/configurator/checksums.sha256
          dotnet run .ci/scripts/write-artifact-checksums.cs -- artifacts/configurator-with-store artifacts/configurator-with-store/checksums.sha256
      - name: Retain unsigned validation packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configurator-linux-x64-and-static-browser
          path: |
            artifacts/configurator/
            artifacts/configurator-with-store/
          if-no-files-found: error
          retention-days: 7
